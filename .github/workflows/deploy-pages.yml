# Build Astro e pubblicazione su GitHub Pages (anteprima del nuovo sito).
# Il sito di progetto è servito sotto /<nome-repo>/: base e site arrivano da actions/configure-pages,
# così il workflow resta valido anche con un dominio personalizzato (base_path vuoto → "/").
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Anteprima: fuori dagli indici dei motori di ricerca e senza GTM/Analytics,
          # per non sporcare i dati del sito in produzione.
          PUBLIC_NOINDEX: 'true'
          PUBLIC_GTM_ID: ''

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
